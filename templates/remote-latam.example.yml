# Remote-LATAM source catalog — template.
#
# Copy to ./remote-latam.yml (user layer, gitignored) and edit. Read by
# scripts/scan-remote-latam.mjs. Every source is a free, public, no-auth board
# with a feed or API: no HTML scraping, no login. Why each source from
# docs/rn-PORTALS.txt is in or out is audited in docs/REMOTE-LATAM-SOURCES.md.
#
# `provider:` is the id of a module in providers/. Provider-specific fields sit
# directly on the entry (same shape as a portals.yml `job_boards:` entry, so a
# stanza can be copied between the two files).

filters:
  # Title gate (case-insensitive JS regex). A posting is kept when `include`
  # matches and `exclude` does not.
  #
  # `include` is stricter than scripts/import-config.sh on purpose. That one was
  # tuned for Brazilian boards, where a bare "dados" or "agent" is a good signal;
  # on international boards the same words pull in "Customer Service Agent",
  # "Data Centers (Texas)" and "SEO & AI Search Manager". Here a title needs an
  # AI/ML/agent/governance term, or "data" next to a leadership word.
  # (The broad import-config.sh include was:
  #   \b(IA|AI|GenAI|LLM)\b|Intelig[eê]ncia Artificial|\bdados\b|\bdata\b|governan|agent )
  include: '\b(AI|IA|ML|LLMs?|GenAI|MLOps|LLMOps|agentic|agents?|machine learning|artificial intelligence|intelig[eê]ncia artificial|prompt|governan\w*|responsible ai)\b|\b(data|dados)\b.*\b(manager|head|director|lead|chief|gerente|gestor|diretor)\b|\b(manager|head|director|lead|chief|gerente|gestor|diretor)\b.*\b(data|dados)\b'
  # `exclude` = the import-config.sh list, plus what the first live dry-run showed
  # as noise: support/service/sales "agents", data centers, annotation, rating and
  # AI-trainer gigs, entry-level, and analyst roles (an "AI Governance Analyst" stays).
  exclude: 'Analista(?!.*Governan)|\bQA\b|Product Manager|Gerente de Produto|\bSAP\b|\bJR\b|J[uú]nior|Junior|Pleno|\bPL\b|Est[aá]gi|Intern|Instrutor|Diretor\(a\) de Arte|Executivo|Hunter|Engenheir[oa] de Dados|Data Engineer|Cientista|Scientist|Sales|Account|Marketing|Clinical|Designer|Dados Mestres|Master Data|customer (service|support|success)|(support|service|real estate|insurance) agent|data cent(er|re)s?|\bSEO\b|annotat|\brater\b|no experience|entry[- ]level|\bAI trainers?\b|(?<!governance\s)\banalyst\b'

  # Region gate (see scripts/lib/latam-eligibility.mjs). A posting whose
  # location/description names one of `accept` is kept; one that names only
  # `reject` is dropped; one that says nothing about region is kept and tagged
  # `loc?` in the pipeline note, never dropped silently.
  latam:
    accept: [latam, latin america, south america, americas, brazil, brasil, sao paulo, worldwide, anywhere, global]
    reject: [us only, usa only, united states only, eu only, europe only, uk only, canada only]

sources:
  # -- Boards listed in docs/rn-PORTALS.txt that already have a provider ------------
  - id: remotive
    provider: remotive
    enabled: true
    notes: JSON feed; location = candidate_required_location

  - id: workingnomads
    provider: workingnomads
    enabled: true
    notes: JSON feed

  - id: nodesk
    provider: nodesk
    enabled: true
    notes: RSS; the feed carries no location, so every row is tagged loc?

  - id: hackernews
    provider: hackernews
    enabled: true
    notes: current "Ask HN - Who is hiring?" thread; covers the hnwork / nthesis / hnjobs mirrors

  # -- Free boards not in docs/rn-PORTALS.txt, with a provider and LATAM signal -----
  - id: getonbrd
    provider: getonbrd
    enabled: true
    categories: [machine-learning-ai, programming, operations-management]
    max_pages: 3
    notes: LATAM-native board

  - id: torre
    provider: torre
    enabled: false
    search: ai engineer
    experience: 5-plus-years
    remote_only: true
    notes: pan-LATAM marketplace, capped at 20 rows per query. OFF - on 2026-10-05 search.torre.co answers HTTP 400 "Invalid request" to every body, even {}. Re-test and turn on if it recovers.

  - id: himalayas
    provider: himalayas
    enabled: true
    notes: location = locationRestrictions, useful to separate worldwide from region-locked

  - id: jobicy
    provider: jobicy
    enabled: true
    notes: location = jobGeo

  - id: remoteok
    provider: remoteok
    enabled: false
    notes: terms ask for a link back to remoteok.com; keep off unless you accept that

  - id: weworkremotely
    provider: weworkremotely
    enabled: true
    notes: RSS; location is often empty

  - id: jobspresso
    provider: jobspresso
    enabled: false
    notes: curated, low volume

  # -- Found by the phase-2 discovery (docs/REMOTE-LATAM-SOURCES.md) ------------
  # Out of 639 board domains in the GitHub lists, these were the two with a free,
  # permitted feed AND vagas that pass the filters above (tested on 2026-10-05).
  - id: remoteyeah
    provider: remoteyeah
    enabled: true
    notes: RSS with a structured location; carries real Brazil / Latin America roles

  - id: tryremotely
    provider: tryremotely
    enabled: true
    max_pages: 50
    notes: official public JSON API, no key (100 req/min), no server-side filter and ~1,300 listings/day across every field, so depth is what reaches the window - 50 pages (~13 MB, ~1 min) is ~3.9 days, enough for the default 3-day window. Stops early once a page is older than --since. Attribution is met by construction - every row links to its tryremotely.com listing

  # Freelance / contract AI and data gigs (Mercor, micro1, Alignerr, Meridial, Appen...).
  # It mixes real engineering with labelling and expert panels, so this source uses a
  # CLASS gate (lib/job-class.mjs) in place of the title regex above: a posting stays only
  # when its domain is in `classes` and its engagement in `engagements`. Domains:
  # governance, data-ai-mgmt, ai-eval, ai-ml-eng, data-science, data-eng, data-analytics,
  # ai-training-ops, software-eng, non-tech. Engagements: employee, contract, freelance-gig,
  # crowd-task, expert-panel, unknown. Every row, from every source, carries its label in
  # the note (e.g. `freelance/ai-ml-eng $60-150/h`).
  - id: aigigjobs
    provider: aigigjobs
    enabled: true
    classes: [ai-ml-eng, ai-eval, data-science, data-eng, data-analytics]
    engagements: [freelance-gig, contract, employee]
    # Each listing page holds 10 postings; breadth comes from this list. robots.txt sets
    # Crawl-delay 5, so 12 pages take ~1 min. Allowed sections: locations, skills,
    # verticals, job-types, platforms (e.g. platforms/mercor).
    pages: [locations/brazil, locations/latin-america, locations/worldwide, locations/mexico, skills/machine-learning, skills/data-analysis, skills/python, skills/nlp, skills/ai-safety, skills/software-engineering, verticals/engineering, verticals/data-analytics]
    notes: JSON-LD on public listing pages, no API. No terms page exists (404); robots.txt allows it with a 5 s crawl delay. Rows link to the posting on aigigjobs.com, not the platform's apply page. Pay is hourly in the note only (never in salary), and an annual figure marked HOUR is read as annual.

  # Provider already in the repo (AI-agent engineering roles), off because the site's
  # own API answered HTTP 500 on 2026-10-05. Re-test with --source agentic-jobs.
  - id: agentic-jobs
    provider: agentic-jobs
    enabled: false
    notes: agentic-engineering-jobs.com REST API; HTTP 500 on 2026-10-05

  # -- RSS feeds with no provider (not built: open-source boards, low fit) -----
  # fossjobs.net (https://www.fossjobs.net/rss/all/) and opensourcejobhub.com
  # (https://opensourcejobhub.com/rss/) both publish a public RSS feed. To add one:
  # write providers/<id>.mjs (model: providers/weworkremotely.mjs) and a test, then
  # list it here. See docs/REMOTE-LATAM-SOURCES.md.

# -- Left out on purpose (audit: docs/REMOTE-LATAM-SOURCES.md) -----------------
# remoterocketship.com -> terms forbid scraping (paid API only).
# remoteleaf.com, remotesource.com, arc.dev -> no job feed, HTML only.
# startup.jobs -> 403 and a restrictive robots.txt.
# ziprecruiter.com, indeed.com -> login / anti-bot / terms.
